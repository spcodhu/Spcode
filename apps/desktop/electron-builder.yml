appId: com.spcode.app
productName: Spcod
copyright: Copyright © 2026 spcodhu

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

# 手机端是由桌面服务托管的 PWA，不是独立 App；统一随安装包携带，远程功能仍默认关闭
extraResources:
  - from: ../mobile/dist
    to: mobile

# pi 引擎是 ESM，Node 的 ESM loader 不支持 asar 归档，
# agent-host 入口与全部依赖必须 unpacked（与 Finch 的 app.asar.unpacked 同款做法）
asarUnpack:
  - "out/main/agent-host.mjs"
  - "node_modules/**"

npmRebuild: false

# mac 无开发者证书（自用）：identity: null 跳过官方签名，改由 afterPack 钩子
# adhoc 重签——不重签会留下密封失效的 Electron 旧签名，下载的副本被 Gatekeeper 判「已损坏」
afterPack: "./build/afterPack.mjs"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null # 不签名（自用决策），有证书后改为证书名并配 notarize
  hardenedRuntime: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Spcod

# 自动更新源：GitHub Releases（updater.ts 的 UPDATE_OWNER/UPDATE_REPO 与此保持一致）
publish:
  provider: github
  owner: spcodhu
  repo: Spcode
  releaseType: release
