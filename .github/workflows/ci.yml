# CI：lint + typecheck + 单测 + e2e 冒烟，仅手动触发
# （Actions 页面选 CI workflow → Run workflow），push/PR 不自动跑。
name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # e2e 需要先出构建产物；macOS runner 自带窗口环境，可直接跑 Electron
      - run: pnpm --filter @spcode/desktop build

      - run: pnpm --filter @spcode/desktop test:e2e
