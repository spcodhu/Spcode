# Release 流水线：推 v* tag 触发。
# 结构：build（mac/win 并行，只打包不发布）→ publish（单 job 汇总上传建 Release）。
# 不让两个平台 job 各自 electron-builder --publish always：并发创建同一 tag 的
# Release 没有幂等保护，后到者 422 中断发布（v0.1.0-beta.1 曾因此丢掉全部 mac 产物）。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        # 失败用例同步写入 GitHub Annotations，公开检查接口即可定位，不再只有 exit code 1。
        run: pnpm --filter @spcode/desktop exec vitest run --reporter=default --reporter=github-actions

      - name: Build mobile PWA
        run: pnpm --filter @spcode/mobile build

      - name: Validate mobile PWA
        working-directory: apps/desktop
        run: pnpm check:mobile

      - name: Build desktop
        run: pnpm --filter @spcode/desktop build

      - name: Package（不发布）
        working-directory: apps/desktop
        run: pnpm exec electron-builder --publish never
        env:
          # macOS 未签名（自用）；接入证书时在此注入 CSC_LINK / CSC_KEY_PASSWORD
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布标签（读取中文公告）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: 汇总两个平台的产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: 校验更新元数据引用的安装包
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re
          import sys

          metadata_files = sorted(Path("dist").glob("latest*.yml"))
          if not metadata_files:
              print("::error::未找到 latest*.yml 自动更新元数据")
              sys.exit(1)

          missing = set()
          for metadata in metadata_files:
              references = set()
              for line in metadata.read_text(encoding="utf-8").splitlines():
                  match = re.match(r"^\s*(?:-\s+)?(?:path|url):\s*(.+?)\s*$", line)
                  if not match:
                      continue
                  name = unquote(match.group(1).strip().strip('"').strip("'"))
                  references.add(name)
                  if not (metadata.parent / name).is_file():
                      missing.add((metadata.name, name))
              if not references:
                  print(f"::error::{metadata.name} 没有 path/url 安装包引用")
                  sys.exit(1)

          if missing:
              for metadata, name in sorted(missing):
                  print(f"::error::{metadata} 引用了不存在的 Release 资产：{name}")
              sys.exit(1)
          print("自动更新元数据与安装包文件名一致")
          PY

      - name: 创建/更新 GitHub Release 并上传全部产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # 自用场景：最新构建始终占 Latest 位（仓库首页 Releases 直接指向最新包），
          # 不按 tag 形态标 Pre-release——beta 与稳定版只通过版本号后缀区分
          prerelease: false
          generate_release_notes: true

      - name: 将中文公告置于自动发布说明之前
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::$TAG 不是附注标签，无法读取发布公告"
            exit 1
          fi
          git tag -l --format='%(contents)' "$TAG" > tag-notes.md
          if [ ! -s tag-notes.md ]; then
            echo "::error::$TAG 没有发布公告"
            exit 1
          fi
          gh release view "$TAG" --json body --jq '.body // ""' > generated-notes.md
          python3 - <<'PY'
          from pathlib import Path

          notes = Path("tag-notes.md").read_text(encoding="utf-8").strip() + "\n"
          generated = Path("generated-notes.md").read_text(encoding="utf-8")
          if generated.startswith(notes):
              print("Release 已包含标签公告，无需重复写入")
          else:
              merged = notes
              if generated.strip():
                  merged += "\n---\n\n" + generated
              Path("release-notes.md").write_text(merged, encoding="utf-8")
              Path("sync-required").touch()
          PY
          if [ -f sync-required ]; then
            gh release edit "$TAG" --notes-file release-notes.md
          fi
