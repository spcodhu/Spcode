# Release 流水线：推 v* tag 触发。
# 结构：build（mac/win 并行，只打包不发布）→ publish（单 job 汇总上传建 Release）。
# 不让两个平台 job 各自 electron-builder --publish always：并发创建同一 tag 的
# Release 没有幂等保护，后到者 422 中断发布（v0.1.0-beta.1 曾因此丢掉全部 mac 产物）。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @spcode/desktop test

      - name: Build
        run: pnpm --filter @spcode/desktop build

      - name: Package（不发布）
        working-directory: apps/desktop
        run: pnpm exec electron-builder --publish never
        env:
          # macOS 未签名（自用）；接入证书时在此注入 CSC_LINK / CSC_KEY_PASSWORD
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 汇总两个平台的产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: 创建/更新 GitHub Release 并上传全部产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # 自用场景：最新构建始终占 Latest 位（仓库首页 Releases 直接指向最新包），
          # 不按 tag 形态标 Pre-release——beta 与稳定版只通过版本号后缀区分
          prerelease: false
          generate_release_notes: true
