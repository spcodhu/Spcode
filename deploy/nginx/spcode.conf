# /etc/nginx/conf.d/spcode.conf
# 控制面仍只监听 127.0.0.1:47831；TLS、OIDC、Host/Origin 与角色由应用再次校验。
limit_req_zone $binary_remote_addr zone=spcode_api:10m rate=10r/s;

upstream spcode_control_plane {
    server 127.0.0.1:47831;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name agent.example.com;

    ssl_certificate     /etc/letsencrypt/live/agent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.example.com/privkey.pem;
    client_max_body_size 25m;

    location / {
        limit_req zone=spcode_api burst=40 nodelay;
        proxy_pass http://spcode_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 65s;
    }

    location ~ ^/api/v1/(events|desktop|worker-node) {
        limit_req zone=spcode_api burst=40 nodelay;
        proxy_pass http://spcode_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name agent.example.com;
    return 301 https://$host$request_uri;
}
